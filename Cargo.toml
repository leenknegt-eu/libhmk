[workspace]
resolver = "2"
members = [
    "crates/libhmk-config",
    "crates/libhmk-core",
    "crates/libhmk-link",
    "crates/libhmk-nrf-esb",
    "crates/libhmk-nrf52840",
    "crates/libhmk-nrf52840-dongle",
    "crates/libhmk-stm32f446",
    "crates/libhmk-at32f405",
]
default-members = [
    "crates/libhmk-config",
    "crates/libhmk-core",
    "crates/libhmk-link",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/leenknegt-eu/libhmk"

[workspace.dependencies]
# Core & build-time crates
libhmk-config = { path = "crates/libhmk-config" }
libhmk-core = { path = "crates/libhmk-core" }
libhmk-link = { path = "crates/libhmk-link" }
libhmk-nrf-esb = { path = "crates/libhmk-nrf-esb" }

# Embedded runtime & Embassy ecosystem
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embedded-storage = "0.3"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2.1"
heapless = "0.8"

embassy-executor = { version = "0.10", default-features = false }
embassy-futures = "0.1"
embassy-sync = "0.8"
embassy-time = { version = "0.5", default-features = false }
embassy-usb = { version = "0.6", default-features = false }
embassy-nrf = { version = "0.11", default-features = false }
embassy-stm32 = { version = "0.6", default-features = false }

# nRF52840 BLE (TrouBLE host + Nordic SoftDevice Controller)
bt-hci = { version = "0.11", default-features = false }
nrf-sdc = { version = "0.4", default-features = false }
nrf-mpsl = { version = "0.4", default-features = false }
trouble-host = { version = "0.8", default-features = false }

# AT32F405 PAC
at32f4xx-pac = { version = "0.4", default-features = false }

[profile.dev]
debug = 2
opt-level = 1

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
