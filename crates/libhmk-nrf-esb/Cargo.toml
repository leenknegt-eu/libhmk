[package]
name = "libhmk-nrf-esb"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interrupt-driven Nordic Enhanced ShockBurst (ESB) PTX/PRX driver for nRF52840 on embassy-nrf"

[dependencies]
cortex-m = { workspace = true }
critical-section = "1.2"
defmt = { workspace = true, optional = true }
embassy-nrf = { workspace = true, features = ["nrf52840", "unstable-pac"] }
embassy-sync = { workspace = true }

[features]
default = []
defmt = ["dep:defmt"]
