name: Build Workflow

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/**"
      - "keyboards/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/ci_define_matrix.py"
  push:
    branches: [main, dev]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/**"
      - "keyboards/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/ci_define_matrix.py"
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Host Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout libhmk
        uses: actions/checkout@v6

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('Cargo.lock') }}

      - name: Run tests
        run: cargo test --locked

  define-matrix:
    name: Define Action Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.define-matrix.outputs.matrix }}
    steps:
      - name: Checkout libhmk
        uses: actions/checkout@v6

      - name: Generate Matrix
        id: define-matrix
        run: |
          MATRIX_JSON=$(python .github/workflows/ci_define_matrix.py)
          echo "matrix=$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    name: Build Firmware
    needs: [test, define-matrix]
    strategy:
      matrix:
        include: ${{ fromJson(needs.define-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout libhmk
        uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add thumbv7em-none-eabihf && rustup component add llvm-tools

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles('Cargo.lock') }}

      - name: Build ${{ matrix.keyboard }}
        env:
          LIBHMK_KEYBOARD: ${{ matrix.keyboard }}
        run: |
          cargo build --locked --release -p ${{ matrix.crate }} --target thumbv7em-none-eabihf
          ELF=target/thumbv7em-none-eabihf/release/${{ matrix.crate }}
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy -type f | head -n1)
          mkdir -p dist
          cp "$ELF" dist/firmware.elf
          "$OBJCOPY" -O binary "$ELF" dist/firmware.bin

      - name: Archive Firmware Artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.keyboard }}
          path: |
            dist/firmware.bin
            dist/firmware.elf

      - name: Build ${{ matrix.keyboard }} with scan-probe instrumentation
        env:
          LIBHMK_KEYBOARD: ${{ matrix.keyboard }}
          LIBHMK_PROBE_SCAN_PIN: ${{ matrix.crate == 'libhmk-nrf52840' && 'P0.26' || 'B5' }}
          LIBHMK_PROBE_LOOP_PIN: ${{ matrix.crate == 'libhmk-nrf52840' && 'P0.27' || 'B6' }}
        run: cargo build --locked --release -p ${{ matrix.crate }} --features scan-probe --target thumbv7em-none-eabihf

  release:
    name: Create Release Draft
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Firmware Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*

      - name: Zip Firmware Binaries
        run: zip -r firmware.zip firmware-*

      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: firmware.zip
